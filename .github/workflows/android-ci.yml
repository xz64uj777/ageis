name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GRADLE_USER_HOME: ${{ runner.temp }}/.gradle
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/gradle-wrapper.properties') }}-${{ hashFiles('**/*.gradle*','**/gradle.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          api-level: 33
          build-tools: '33.0.2'
          # components: 'build-tools;33.0.2,platforms;android-33,platform-tools'

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Run lint
        run: ./gradlew lintDebug --no-daemon --stacktrace

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Bundle release AAB
        run: ./gradlew bundleRelease --no-daemon --stacktrace

      # --- Signing instructions (optional, enable after first successful CI run) ---
      # To enable signing, add the following repository secrets:
      # - KEYSTORE_BASE64 (base64-encoded keystore file)
      # - KEYSTORE_PASSWORD
      # - KEY_ALIAS
      # - KEY_PASSWORD
      #
      # Example steps to import the keystore at runtime and provide signing properties to Gradle:
      # - name: Import release keystore
      #   if: ${{ secrets.KEYSTORE_BASE64 != '' }}
      #   run: |
      #     echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > release.keystore
      #     mkdir -p $HOME/.keystores
      #     mv release.keystore $HOME/.keystores/release.keystore
      #
      # - name: Set signing properties
      #   if: ${{ secrets.KEYSTORE_BASE64 != '' }}
      #   run: |
      #     echo "RELEASE_STORE_FILE=$HOME/.keystores/release.keystore" >> $GITHUB_ENV
      #     echo "RELEASE_STORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
      #     echo "RELEASE_KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> $GITHUB_ENV
      #     echo "RELEASE_KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> $GITHUB_ENV
      #
      # Then configure your Gradle signingConfig to read from environment variables or gradle.properties.
      # Example (gradle.properties or signing config):
      #   storeFile = System.getenv("RELEASE_STORE_FILE")
      #   storePassword = System.getenv("RELEASE_STORE_PASSWORD")
      #   keyAlias = System.getenv("RELEASE_KEY_ALIAS")
      #   keyPassword = System.getenv("RELEASE_KEY_PASSWORD")
      #
      # The above steps are optional and conditional; the workflow will NOT require these secrets to succeed.

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: app/build/outputs/bundle/release/*.aab
